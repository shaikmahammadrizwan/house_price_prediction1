<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f7fb; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 30px; margin: 0; }
        .container { width: 100%; max-width: 700px; background: white; padding: 35px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 7px; font-weight: bold; }
        input { padding: 12px; border: 1px solid #ccc; border-radius: 7px; font-size: 15px; }
        button { width: 100%; margin-top: 25px; padding: 14px; border: none; border-radius: 8px; background: #2563eb; color: white; font-size: 17px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        #result { margin-top: 25px; padding: 20px; background: #f0fdf4; border-radius: 8px; text-align: center; }
        #price { font-size: 25px; font-weight: bold; margin-top: 8px; color: #15803d; }
        #error { margin-top: 20px; padding: 15px; background: #fef2f2; color: red; border-radius: 8px; text-align: center; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🏠 House Price Prediction</h1>
    <p class="subtitle">Enter the house details to predict its price</p>

    <form method="POST" action="/">
        <div class="form-grid">
            <div class="form-group"><label>Area (sqft)</label><input type="number" step="any" name="area" required></div>
            <div class="form-group"><label>Bedrooms</label><input type="number" step="1" name="bedrooms" required></div>
            <div class="form-group"><label>Bathrooms</label><input type="number" step="1" name="bathrooms" required></div>
            <div class="form-group"><label>House Age</label><input type="number" step="any" name="house_age" required></div>
            <div class="form-group"><label>Distance to City</label><input type="number" step="any" name="distance_to_city" required></div>
            <div class="form-group"><label>Parking</label><input type="number" step="1" name="parking" required></div>
            <div class="form-group"><label>Floor</label><input type="number" step="1" name="floor" required></div>
            <div class="form-group"><label>Nearby Schools</label><input type="number" step="1" name="nearby_schools" required></div>
            <div class="form-group"><label>Crime Rate</label><input type="number" step="any" name="crime_rate" required></div>
        </div>
        <button type="submit">Predict House Price</button>
    </form>

    {% if prediction %}
    <div id="result">
        <div>Predicted House Price</div>
        <div id="price">{{ prediction }}</div>
    </div>
    {% endif %}

    {% if error %}
    <div id="error">{{ error }}</div>
    {% endif %}
</div>

</body>
</html>
