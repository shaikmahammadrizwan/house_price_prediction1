<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 700px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #4a90e2;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        #result {
            margin-top: 25px;

            padding: 20px;

            background: #f0fdf4;

            border-radius: 8px;

            text-align: center;

            display: none;
        }

        #price {
            font-size: 25px;

            font-weight: bold;

            margin-top: 8px;
        }

        #error {
            margin-top: 20px;

            padding: 15px;

            background: #fef2f2;

            color: red;

            border-radius: 8px;

            text-align: center;

            display: none;
        }

        @media (max-width: 600px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>🏠 House Price Prediction</h1>


    <p class="subtitle">
        Enter the house details to predict its price
    </p>


    <div class="form-grid">


        <div class="form-group">

            <label for="area">
                Area (sqft)
            </label>

            <input
                type="number"
                id="area"
                step="any"
                required
            >

        </div>


        <div class="form-group">

            <label for="bedrooms">
                Bedrooms
            </label>

            <input
                type="number"
                id="bedrooms"
                step="1"
                required
            >

        </div>


        <div class="form-group">

            <label for="bathrooms">
                Bathrooms
            </label>

            <input
                type="number"
                id="bathrooms"
                step="1"
                required
            >

        </div>


        <div class="form-group">

            <label for="house_age">
                House Age
            </label>

            <input
                type="number"
                id="house_age"
                step="any"
                required
            >

        </div>


        <div class="form-group">

            <label for="distance_to_city">
                Distance to City
            </label>

            <input
                type="number"
                id="distance_to_city"
                step="any"
                required
            >

        </div>


        <div class="form-group">

            <label for="parking">
                Parking
            </label>

            <input
                type="number"
                id="parking"
                step="1"
                required
            >

        </div>


        <div class="form-group">

            <label for="floor">
                Floor
            </label>

            <input
                type="number"
                id="floor"
                step="1"
                required
            >

        </div>


        <div class="form-group">

            <label for="nearby_schools">
                Nearby Schools
            </label>

            <input
                type="number"
                id="nearby_schools"
                step="1"
                required
            >

        </div>


        <div class="form-group">

            <label for="crime_rate">
                Crime Rate
            </label>

            <input
                type="number"
                id="crime_rate"
                step="any"
                required
            >

        </div>


    </div>


    <button id="predictButton" onclick="predictPrice()">

        Predict House Price

    </button>


    <div id="result">

        <div>
            Predicted House Price
        </div>

        <div id="price"></div>

    </div>


    <div id="error"></div>


</div>


<script>


// ======================================================
// FASTAPI BACKEND URL
// ======================================================

const API_URL =
    "/predict";


// ======================================================
// PREDICT HOUSE PRICE
// ======================================================

async function predictPrice() {

    const result =
        document.getElementById("result");

    const price =
        document.getElementById("price");

    const error =
        document.getElementById("error");

    const button =
        document.getElementById("predictButton");


    // Hide previous messages

    result.style.display = "none";

    error.style.display = "none";


    // Get values from form

    const data = {

        area: Number(
            document.getElementById("area").value
        ),

        bedrooms: Number(
            document.getElementById("bedrooms").value
        ),

        bathrooms: Number(
            document.getElementById("bathrooms").value
        ),

        house_age: Number(
            document.getElementById("house_age").value
        ),

        distance_to_city: Number(
            document.getElementById("distance_to_city").value
        ),

        parking: Number(
            document.getElementById("parking").value
        ),

        floor: Number(
            document.getElementById("floor").value
        ),

        nearby_schools: Number(
            document.getElementById("nearby_schools").value
        ),

        crime_rate: Number(
            document.getElementById("crime_rate").value
        )

    };


    // Check that all values were entered

    for (const key in data) {

        if (!Number.isFinite(data[key])) {

            error.textContent =
                "Please enter valid values for all fields.";

            error.style.display = "block";

            return;
        }

    }


    try {

        // Disable button while prediction is running

        button.disabled = true;

        button.textContent = "Predicting...";


        // Send request to FastAPI

        const response = await fetch(
            API_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );


        // Convert response to JSON

        const responseData =
            await response.json();


        // Check for backend error

        if (!response.ok) {

            throw new Error(
                responseData.detail ||
                "Prediction failed"
            );

        }


        // Display prediction

        price.textContent =
            "₹ " +
            Number(
                responseData.predicted_house_price
            ).toLocaleString("en-IN");


        result.style.display = "block";


    }
    catch (err) {

        console.error(
            "Prediction error:",
            err
        );


        error.textContent =
            "Error: " + err.message;


        error.style.display = "block";

    }
    finally {

        button.disabled = false;

        button.textContent =
            "Predict House Price";

    }

}


</script>


</body>

</html>
