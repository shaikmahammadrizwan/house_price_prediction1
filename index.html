<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 700px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #4a90e2;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #93a3c4;

            cursor: not-allowed;
        }

        #result {
            margin-top: 25px;

            padding: 20px;

            background: #f0fdf4;

            border-radius: 8px;

            text-align: center;

            display: none;
        }

        #price {
            font-size: 25px;

            font-weight: bold;

            margin-top: 8px;

            color: #166534;
        }

        #error {
            margin-top: 20px;

            padding: 12px;

            color: #b91c1c;

            background: #fef2f2;

            border-radius: 8px;

            text-align: center;

            display: none;
        }

        @media (max-width: 600px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏠 House Price Prediction</h1>

    <p class="subtitle">
        Enter the house details to predict its price
    </p>


    <div class="form-grid">

        <!-- Area -->
        <div class="form-group">
            <label for="area">Area (sqft)</label>

            <input
                type="number"
                id="area"
                step="any"
                min="0"
                placeholder="Example: 1500"
                required
            >
        </div>


        <!-- Bedrooms -->
        <div class="form-group">
            <label for="bedrooms">Bedrooms</label>

            <input
                type="number"
                id="bedrooms"
                step="1"
                min="0"
                placeholder="Example: 3"
                required
            >
        </div>


        <!-- Bathrooms -->
        <div class="form-group">
            <label for="bathrooms">Bathrooms</label>

            <input
                type="number"
                id="bathrooms"
                step="1"
                min="0"
                placeholder="Example: 2"
                required
            >
        </div>


        <!-- House Age -->
        <div class="form-group">
            <label for="house_age">House Age</label>

            <input
                type="number"
                id="house_age"
                step="any"
                min="0"
                placeholder="Example: 10"
                required
            >
        </div>


        <!-- Distance to City -->
        <div class="form-group">
            <label for="distance_to_city">Distance to City</label>

            <input
                type="number"
                id="distance_to_city"
                step="any"
                min="0"
                placeholder="Example: 5"
                required
            >
        </div>


        <!-- Parking -->
        <div class="form-group">
            <label for="parking">Parking</label>

            <input
                type="number"
                id="parking"
                step="1"
                min="0"
                placeholder="Example: 2"
                required
            >
        </div>


        <!-- Floor -->
        <div class="form-group">
            <label for="floor">Floor</label>

            <input
                type="number"
                id="floor"
                step="1"
                min="0"
                placeholder="Example: 2"
                required
            >
        </div>


        <!-- Nearby Schools -->
        <div class="form-group">
            <label for="nearby_schools">Nearby Schools</label>

            <input
                type="number"
                id="nearby_schools"
                step="1"
                min="0"
                placeholder="Example: 3"
                required
            >
        </div>


        <!-- Crime Rate -->
        <div class="form-group">
            <label for="crime_rate">Crime Rate</label>

            <input
                type="number"
                id="crime_rate"
                step="any"
                min="0"
                placeholder="Example: 2.5"
                required
            >
        </div>

    </div>


    <button
        id="predictButton"
        onclick="predictPrice()"
    >
        Predict House Price
    </button>


    <!-- Prediction Result -->

    <div id="result">

        <div>
            Predicted House Price
        </div>

        <div id="price">
        </div>

    </div>


    <!-- Error -->

    <div id="error">
    </div>

</div>


<script>

async function predictPrice() {

    const result = document.getElementById("result");

    const price = document.getElementById("price");

    const error = document.getElementById("error");

    const button = document.getElementById("predictButton");


    // Hide previous result/error

    result.style.display = "none";

    error.style.display = "none";


    // Get input values

    const area = Number(
        document.getElementById("area").value
    );

    const bedrooms = Number(
        document.getElementById("bedrooms").value
    );

    const bathrooms = Number(
        document.getElementById("bathrooms").value
    );

    const houseAge = Number(
        document.getElementById("house_age").value
    );

    const distanceToCity = Number(
        document.getElementById("distance_to_city").value
    );

    const parking = Number(
        document.getElementById("parking").value
    );

    const floor = Number(
        document.getElementById("floor").value
    );

    const nearbySchools = Number(
        document.getElementById("nearby_schools").value
    );

    const crimeRate = Number(
        document.getElementById("crime_rate").value
    );


    // Check that all fields are filled

    if (
        !area ||
        !bedrooms ||
        !bathrooms ||
        !houseAge ||
        !distanceToCity ||
        !parking ||
        !floor ||
        !nearbySchools ||
        !crimeRate
    ) {

        error.textContent =
            "Please enter values in all fields.";

        error.style.display = "block";

        return;
    }


    // Disable button while requesting prediction

    button.disabled = true;

    button.textContent = "Predicting...";


    try {

        /*
            Your FastAPI function currently accepts
            these values as QUERY PARAMETERS.

            Therefore we send them in the URL.
        */

        const url =
            "https://house-price-prediction-gkou.onrender.com/predict" +

            "?area_sqft=" + encodeURIComponent(area) +

            "&bedrooms=" + encodeURIComponent(bedrooms) +

            "&bathrooms=" + encodeURIComponent(bathrooms) +

            "&age_of_house=" + encodeURIComponent(houseAge) +

            "&distance_to_city=" + encodeURIComponent(distanceToCity) +

            "&parking=" + encodeURIComponent(parking) +

            "&floor=" + encodeURIComponent(floor) +

            "&nearby_schools=" + encodeURIComponent(nearbySchools) +

            "&crime_rate=" + encodeURIComponent(crimeRate);


        // Call FastAPI

        const response = await fetch(url, {

            method: "POST"

        });


        // Convert response to JSON

        const responseData = await response.json();


        // Check for API error

        if (!response.ok) {

            throw new Error(
                responseData.detail ||
                "Prediction failed"
            );
        }


        /*
            Your FastAPI returns:

            {
                "predicted_house_price": ...
            }

            So we use predicted_house_price here.
        */

        const predictedPrice =
            responseData.predicted_house_price;


        // Display price

        price.textContent =
            "₹ " +
            Number(predictedPrice).toLocaleString("en-IN", {
                maximumFractionDigits: 2
            });


        result.style.display = "block";


    } catch (err) {

        console.error(err);


        error.textContent =
            "Error: " + err.message;


        error.style.display = "block";


    } finally {

        // Enable button again

        button.disabled = false;

        button.textContent =
            "Predict House Price";
    }

}

</script>

</body>
</html>
